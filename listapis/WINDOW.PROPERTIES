# KDEV XW 2000 - Core API List (Required by default, built into nxdk .a archive)
API_TYPE=CORE
REQUIRED_DEFAULT=1
PROPERTIES_LOCATION=listapis/WINDOW.PROPERTIES
SOURCE_BASE_DIR=src/apis
TARGET_WIN2000=Win2000_API
TARGET_NXDK=nxdk_API
API_LIST=GetTickCount,Sleep,QueryPerformanceCounter,QueryPerformanceFrequency,GetLastError,SetLastError,CreateFileA,ReadFile,WriteFile,GetFileSize,SetFilePointer,DeleteFileA,CloseHandle,HeapAlloc,HeapFree

[API.GetTickCount]
API_TYPE=CORE
WIN2000=GetTickCount
NXDK=GetTickCount / xw_impl_GetTickCount
LOCATION=src/apis/GetTickCount.c

